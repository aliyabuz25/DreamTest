version: "3.8"

networks:
  octobot-net:
    external: true
    name: octobot-net
  edge:
    external: true
    name: edge

volumes:
  celalyabuz-ds-db:
  celalyabuz-ds-uploads:
  celalyabuz-ds-auth:

services:

  dreamstudio-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: celalyabuz-ds:latest
    pull_policy: build
    container_name: celalyabuz-ds
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      WA_SERVER_URL: http://celalyabuz-ds-wa:3001
      SITE_URL: https://celalyabuz.store
      ADMIN_PHONE: "905464233871"
    volumes:
      - celalyabuz-ds-db:/app/admin/db
      - celalyabuz-ds-uploads:/app/admin/uploads
      - celalyabuz-ds-uploads:/app/public/uploads
    depends_on:
      - dreamstudio-wa
    networks:
      - octobot-net
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.services.celalyabuz-ds.loadbalancer.server.port=3000

      # HTTP → HTTPS redirect
      - traefik.http.middlewares.celalyabuz-https.redirectscheme.scheme=https
      - traefik.http.middlewares.celalyabuz-https.redirectscheme.permanent=true
      - traefik.http.routers.celalyabuz-http.rule=Host(`celalyabuz.store`)
      - traefik.http.routers.celalyabuz-http.entrypoints=web
      - traefik.http.routers.celalyabuz-http.middlewares=celalyabuz-https
      - traefik.http.routers.celalyabuz-http.service=noop@internal

      # HTTPS
      - traefik.http.routers.celalyabuz-https.rule=Host(`celalyabuz.store`)
      - traefik.http.routers.celalyabuz-https.entrypoints=websecure
      - traefik.http.routers.celalyabuz-https.tls=true
      - traefik.http.routers.celalyabuz-https.tls.certresolver=letsencrypt
      - traefik.http.routers.celalyabuz-https.service=celalyabuz-ds

  dreamstudio-wa:
    build:
      context: .
      dockerfile: Dockerfile.wa
    image: celalyabuz-ds-wa:latest
    pull_policy: build
    container_name: celalyabuz-ds-wa
    restart: unless-stopped
    volumes:
      - celalyabuz-ds-auth:/app/admin/auth_info
    networks:
      - octobot-net